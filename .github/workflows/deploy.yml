name: BirdAhead production release
on:
  workflow_dispatch:
    inputs:
      provision:
        description: 'Create/verify dedicated D1 and R2 resources before release'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['app/**', 'migrations/**', 'wrangler*.jsonc', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: birdahead-production
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test --prefix app
      - run: npm run build --prefix app
      - name: Validate generic production bundle
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --dry-run --config ../wrangler.production.jsonc --no-x-provision --no-x-auto-create

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provision == true) ||
      (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --ignore-scripts
      - run: npm run build --prefix app
      - name: Verify credentials and provision BirdAhead-only resources
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Ensure dedicated D1 database
        working-directory: app
        run: |
          set -euo pipefail
          WRANGLER=./node_modules/.bin/wrangler
          $WRANGLER d1 list --json > "$RUNNER_TEMP/d1.json"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/d1.json"));const row=d.find(x=>x.name==="birdahead");if(row) console.log(row.uuid);' > "$RUNNER_TEMP/d1-id.txt"
          if [ ! -s "$RUNNER_TEMP/d1-id.txt" ]; then
            $WRANGLER d1 create birdahead > "$RUNNER_TEMP/d1-create.txt"
            cat "$RUNNER_TEMP/d1-create.txt"
            grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/d1-create.txt" | head -1 > "$RUNNER_TEMP/d1-id.txt"
          fi
          test -s "$RUNNER_TEMP/d1-id.txt"
          echo "BIRDAHEAD_D1_ID=$(cat "$RUNNER_TEMP/d1-id.txt")" >> "$GITHUB_ENV"
      - name: Ensure private R2 bucket
        working-directory: app
        run: |
          set -euo pipefail
          WRANGLER=./node_modules/.bin/wrangler
          $WRANGLER r2 bucket list > "$RUNNER_TEMP/r2.txt"
          if ! grep -q 'birdahead-private' "$RUNNER_TEMP/r2.txt"; then $WRANGLER r2 bucket create birdahead-private; fi
      - name: Generate dedicated production config
        run: node scripts/prepare_production.mjs
      - name: Apply reviewed additive migrations
        working-directory: app
        run: npx wrangler d1 migrations apply DB --remote --config ../wrangler.production.generated.jsonc --no-x-provision --no-x-auto-create
      - name: Write private release secrets
        env:
          HANK_KEY: ${{ secrets.BIRDAHEAD_HANK_KEY }}
          HEATHER_KEY: ${{ secrets.BIRDAHEAD_HEATHER_KEY }}
          PUBLISH_TOKEN: ${{ secrets.BIRDAHEAD_PUBLISH_TOKEN }}
        run: |
          node -e 'const fs=require("fs");if(!process.env.HANK_KEY||!process.env.HEATHER_KEY||!process.env.PUBLISH_TOKEN)throw new Error("Missing BirdAhead secrets");fs.writeFileSync(process.env.RUNNER_TEMP+"/birdahead-secrets.json",JSON.stringify({HANK_KEY:process.env.HANK_KEY,HEATHER_KEY:process.env.HEATHER_KEY,PUBLISH_TOKEN:process.env.PUBLISH_TOKEN}),{mode:0o600})'
      - name: Deploy the exact revision
        working-directory: app
        run: >-
          npx wrangler deploy --config ../wrangler.production.generated.jsonc --no-x-provision --no-x-auto-create
          --secrets-file "$RUNNER_TEMP/birdahead-secrets.json"
          --var "DEPLOY_REVISION:$GITHUB_SHA" --message "BirdAhead production $GITHUB_SHA"
      - name: Verify HTTPS health and canonical host
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://birdahead.com/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/health.json"
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/health.json"));if(h.revision!==process.env.GITHUB_SHA||!h.release)process.exit(1)'
          www_status=$(curl -s -o /dev/null -w '%{http_code}' https://www.birdahead.com/ || true)
          echo "www status: $www_status"
          case "$www_status" in 301|302|307|308) ;; 000) echo 'warning: local DNS could not resolve www during the runner check' ;; *) exit 1 ;; esac
      - name: Record deployed resources
        run: |
          echo "Dedicated D1: birdahead ($BIRDAHEAD_D1_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "Dedicated private R2: birdahead-private" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
