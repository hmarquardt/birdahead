name: BirdAhead checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birdahead-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: npm ci --prefix app --ignore-scripts
      - run: npm test --prefix app
      - run: npm run build --prefix app
      - name: Validate Worker bundle without deployment
        working-directory: app
        run: npx wrangler deploy --dry-run --config ../wrangler.local.jsonc --no-x-provision --no-x-auto-create
